# GitHub Pages 배포: main에 push하거나 Actions 탭에서 수동 실행하면 테스트 → 빌드 → 배포한다.
# 사전 설정: 저장소 Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 GITHUB_TOKEN 권한 (actions/starter-workflows의 pages 템플릿과 같음)
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 실행한다. 진행 중인 배포는 취소하지 않고, 대기 중인 실행은 최신 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26 # Active LTS (2026-10-28부터)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
