<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1e21" />
    <title>주차 시뮬레이터 · Parking Simulator</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <!-- 리플레이 (main.ts): 탑뷰 캔버스 + 조작 막대(ReplayBar가 붙인다). 위쪽 버튼 줄보다 먼저 둬서 그 아래에 그려진다 -->
      <div id="replay-ui"><canvas id="replay-top"></canvas></div>
      <canvas id="minimap" class="panel"></canvas>
      <canvas id="sensors" class="panel"></canvas>
      <div id="topbar">
        <div id="status" class="panel"></div>
        <button id="btn-restart" class="icon" data-i18n-label="restart">↺</button>
        <button id="btn-records" class="icon" data-i18n-label="records">★</button>
        <button id="btn-settings" class="icon" data-i18n-label="settings">⚙</button>
      </div>
      <div id="rearcam"><span data-i18n="rearCamLabel"></span></div>
      <div id="looks">
        <button data-look="LM" data-i18n="lookLM"></button>
        <button data-look="LW" data-i18n="lookLW"></button>
        <button data-look="F" data-i18n="lookF"></button>
        <button data-look="RW" data-i18n="lookRW"></button>
        <button data-look="RM" data-i18n="lookRM"></button>
        <button data-look="BACK" data-i18n="lookBack"></button>
      </div>
      <div id="touch">
        <div id="wheel">
          <svg id="wheel-img" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="42" fill="none" stroke="#d0d3d8" stroke-width="9" />
            <rect x="12" y="46" width="76" height="8" rx="3" fill="#d0d3d8" />
            <rect x="46" y="50" width="8" height="38" rx="3" fill="#d0d3d8" />
            <circle cx="50" cy="50" r="10" fill="#d0d3d8" />
            <rect x="45" y="4" width="10" height="9" rx="2" fill="#ff453a" />
          </svg>
        </div>
        <div id="pedals">
          <div id="gearbox">
            <button data-gear="P">P</button>
            <button data-gear="R">R</button>
            <button data-gear="N">N</button>
            <button data-gear="D">D</button>
          </div>
          <button id="pedal-brake" class="pedal" data-i18n="brake"></button>
          <button id="pedal-accel" class="pedal" data-i18n="accel"></button>
        </div>
      </div>
      <div id="toast"></div>
      <div id="overlay"></div>
      <div id="settings-panel"></div>
      <div id="records-panel"></div>
      <div id="rotate-hint"><span data-i18n="rotate"></span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
